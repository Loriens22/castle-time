<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">

		<title>Castle TIME</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #05050a;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">

<style>html,body,#canvas{overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}</style>
<script>
/* Castle TIME mobile helpers (Android Chrome first):
   - Chrome for Android only grants audio "user activation" on touchend/pointerup/click, not touchstart,
     so we track every AudioContext the engine creates and resume it (plus a silent unlock buffer) on those events.
   - Also resume after the tab comes back from background.
   - Fullscreen + landscape lock is requested from a real gesture when the game sets window.__ctWantFS. */
(function(){
  var ctxs = []; window.__ctAudio = {ctxs: ctxs, unlocked: false};
  var AC = window.AudioContext || window.webkitAudioContext;
  if (AC) {
    var P = class extends AC { constructor(){ super(...arguments); ctxs.push(this); } };
    window.AudioContext = P; if (window.webkitAudioContext) window.webkitAudioContext = P;
    if (location.search.indexOf('touchdebug') >= 0) {
      /* test hook only: tap everything that reaches the speakers into an analyser to measure real output */
      var cn = AudioNode.prototype.connect;
      AudioNode.prototype.connect = function(d){
        var r = cn.apply(this, arguments);
        try { if (d === this.context.destination && !this.__ctA) { var c = this.context; if (!c.__ctAn) { c.__ctAn = c.createAnalyser(); c.__ctAn.fftSize = 2048; c.__ctAn.__ctA = true; } cn.call(this, c.__ctAn); } } catch (e) {}
        return r;
      };
      window.__ctAudio.info = function(){
        return ctxs.map(function(c){ var peak = 0; if (c.__ctAn) { var a = new Float32Array(2048); c.__ctAn.getFloatTimeDomainData(a); for (var i = 0; i < a.length; i++) peak = Math.max(peak, Math.abs(a[i])); }
          return {state: c.state, time: +c.currentTime.toFixed(2), peak: +peak.toFixed(4)}; });
      };
    }
  }
  function unlock(){
    for (var i = 0; i < ctxs.length; i++) {
      var c = ctxs[i];
      try {
        if (c.state !== 'running' && c.state !== 'closed') c.resume();
        if (!c.__ctSilent) { var b = c.createBuffer(1, 1, 22050), s = c.createBufferSource(); s.buffer = b; s.connect(c.destination); s.start(0); c.__ctSilent = true; }
      } catch (e) {}
    }
    window.__ctAudio.unlocked = ctxs.length > 0 && ctxs.every(function(c){ return c.state === 'running'; });
    if (window.__ctWantFS) {
      window.__ctWantFS = false;
      var el = document.documentElement, rq = el.requestFullscreen || el.webkitRequestFullscreen;
      if (rq && !document.fullscreenElement) {
        try {
          var pr = rq.call(el, {navigationUI: 'hide'});
          if (pr && pr.then) pr.then(function(){ if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(function(){}); }).catch(function(){});
        } catch (e) {}
      }
    }
  }
  ['touchend', 'pointerup', 'click', 'keydown'].forEach(function(t){ window.addEventListener(t, unlock, {capture: true, passive: true}); });
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) unlock(); });
  window.addEventListener('contextmenu', function(e){ e.preventDefault(); });
})();
</script>

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--false fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":13355420,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
